[project]
name = "telegram-folder-uploader"
version = "1.0.0"
description = "Upload files from a local folder to a Telegram group or channel using Telethon."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cryptg>=0.5.2",
    "questionary>=2.1.1",
    "rich>=15.0.0",
    "telethon>=1.45,<2",
]

[project.scripts]
telegram-folder-uploader = "telegram_folder_uploader.cli:main"
upload-telegram = "telegram_folder_uploader.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_folder_uploader"]
